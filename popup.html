<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 420px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    padding: 16px;
  }
  h1 { font-size: 16px; color: #fff; margin-bottom: 2px; }
  h1 span { color: #4ecdc4; }
  .subtitle { font-size: 11px; color: #777; margin-bottom: 16px; }

  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .stat-num { font-size: 20px; font-weight: 700; color: #4ecdc4; }
  .stat-label { font-size: 10px; color: #777; text-transform: uppercase; letter-spacing: 0.3px; }

  .section { margin-bottom: 12px; }

  .btn {
    width: 100%;
    padding: 10px;
    border: 1px solid #222;
    border-radius: 8px;
    background: #141414;
    color: #e0e0e0;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.2s;
  }
  .btn:hover { border-color: #4ecdc4; color: #4ecdc4; }
  .btn-primary {
    background: linear-gradient(135deg, #4ecdc4, #44b8a8);
    color: #000;
    border-color: #4ecdc4;
    font-weight: 600;
  }
  .btn-primary:hover { opacity: 0.9; color: #000; }
  .btn-danger { border-color: #ff6b6b; color: #ff6b6b; }

  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  .status { font-size: 11px; color: #777; text-align: center; margin-top: 4px; }

  .form-group { margin-bottom: 12px; }
  .form-label { font-size: 11px; color: #777; margin-bottom: 4px; display: block; }
  .form-input, .form-textarea {
    width: 100%;
    padding: 8px 10px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 6px;
    color: #e0e0e0;
    font-size: 12px;
    font-family: inherit;
  }
  .form-input:focus, .form-textarea:focus { border-color: #4ecdc4; outline: none; }
  select.form-input { appearance: auto; }
  .form-textarea { resize: vertical; min-height: 80px; }
  .form-row { display: flex; gap: 8px; }
  .form-row .form-group { flex: 1; }
  .form-hint { font-size: 10px; color: #555; margin-top: 3px; }

  .progress-bar {
    height: 4px;
    background: #222;
    border-radius: 2px;
    margin: 8px 0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4ecdc4;
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }

  .results-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
    margin-top: 8px;
  }
  .results-table th {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid #333;
    color: #4ecdc4;
    font-weight: 600;
  }
  .results-table td {
    padding: 5px 8px;
    border-bottom: 1px solid #1a1a1a;
  }
  .results-wrap {
    max-height: 250px;
    overflow-y: auto;
    background: #141414;
    border: 1px solid #222;
    border-radius: 8px;
  }

  .fetch-log {
    max-height: 120px;
    overflow-y: auto;
    background: #0d0d0d;
    border: 1px solid #1a1a1a;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 10px;
    color: #555;
    margin-top: 8px;
    font-family: 'SF Mono', monospace;
  }
  .fetch-log .success { color: #51cf66; }
  .fetch-log .error { color: #ff6b6b; }

  .step {
    padding: 10px 12px;
    background: #141414;
    border: 1px solid #222;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .step-num {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #4ecdc4;
    color: #000;
    text-align: center;
    line-height: 20px;
    font-size: 11px;
    font-weight: 700;
    margin-right: 8px;
  }
  .step-title { font-size: 12px; font-weight: 600; color: #fff; }
  .step-desc { font-size: 10px; color: #777; margin-top: 4px; margin-left: 28px; }
</style>
</head>
<body>
  <h1>Live<span>Scope</span></h1>
  <p class="subtitle">TikTok livestream intelligence via Kalodata</p>

  <!-- STEP 1: GRAB CREATORS -->
  <div class="step">
    <span class="step-num">1</span>
    <span class="step-title">Browse Kalodata with your filters</span>
    <div class="step-desc">Go to Creator Rankings, apply filters (Live, Independent, etc), then:</div>
  </div>

  <button class="btn btn-primary" id="grabFromPage">Grab Creators from Page</button>

  <!-- STEP 2: FETCH DETAILS -->
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Start Date</label>
      <input type="date" class="form-input" id="startDate">
    </div>
    <div class="form-group">
      <label class="form-label">End Date</label>
      <input type="date" class="form-input" id="endDate">
    </div>
    <div class="form-group" style="flex: 0 0 70px;">
      <label class="form-label">Delay (ms)</label>
      <input type="number" class="form-input" id="fetchDelay" value="2000" min="500" max="10000">
    </div>
  </div>

  <button class="btn" id="startFetch">Fetch Livestreams + Products</button>

  <div class="progress-bar" id="progressBar" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="fetch-log" id="fetchLog" style="display:none"></div>

  <!-- RESULTS -->
  <div id="activeResults" style="display:none; margin-top: 12px;">
    <div class="stats">
      <div class="stat-card">
        <div class="stat-num" id="activeCreatorCount">0</div>
        <div class="stat-label">Creators</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="activeLsCount">0</div>
        <div class="stat-label">Livestreams</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="activeTotalRev">$0</div>
        <div class="stat-label">Total Rev</div>
      </div>
    </div>

    <div class="results-wrap">
      <table class="results-table">
        <thead>
          <tr>
            <th>Creator</th>
            <th>Revenue</th>
            <th>Items</th>
            <th>Products</th>
          </tr>
        </thead>
        <tbody id="activeResultsBody"></tbody>
      </table>
    </div>
  </div>

  <!-- EXPORT -->
  <div style="margin-top: 12px;">
    <button class="btn btn-primary" id="sendActiveToLiveScope">Send to LiveScope</button>
    <div class="btn-row">
      <button class="btn" id="exportActiveCSV">Export CSV</button>
      <button class="btn" id="exportActiveJSON">Export JSON</button>
    </div>
    <button class="btn btn-danger" id="clearBtn" style="margin-top: 4px;">Clear Data</button>
  </div>

  <div class="status" id="status"></div>

  <!-- Hidden fields for backwards compat -->
  <textarea id="creatorIds" style="display:none"></textarea>

<script src="popup.js"></script>
</body>
</html>
